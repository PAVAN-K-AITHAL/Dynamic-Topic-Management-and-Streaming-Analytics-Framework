# Prometheus scrape configuration
# Scrapes the FastAPI model server for prediction metrics

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'fraud-model-server'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'model-server'

  - job_name: 'fraud-admin-service'
    static_configs:
      - targets: ['host.docker.internal:5000']
        labels:
          service: 'admin-service'
