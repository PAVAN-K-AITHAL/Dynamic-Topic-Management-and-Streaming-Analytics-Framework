# Infrastructure services for the Fraud Detection Pipeline
# Usage: docker compose -f docker/docker-compose.infra.yml up -d
#
# Services:
#   Kafka      → localhost:9092  (KRaft mode, no Zookeeper)
#   Redis      → localhost:6379  (Feature store)
#   MLflow     → localhost:5001  (Experiment tracking UI)
#   Prometheus → localhost:9090  (Metrics collection)
#   Grafana    → localhost:3001  (Monitoring dashboards)

services:
  # ── Kafka (KRaft mode — NO Zookeeper needed) ───────────────────────
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "FraudDetectCluster2026"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Feature Store / User Profiles) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MLflow (Experiment Tracking + Model Registry) ──────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: fraud-mlflow
    ports:
      - "5001:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  # ── Prometheus (Metrics Collection) ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Grafana (Monitoring Dashboards) ────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: fraud-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  kafka_data:
  redis_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
